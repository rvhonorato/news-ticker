[package]
name = "news-ticker"
version = "2.0.0"
edition = "2024"
description = "A CLI news ticker that fetches and displays RSS feeds"
authors = ["Rodrigo V. Honorato <rvhonorato@pm.me>"]
license = "0BSD"
repository = "https://codeberg.org/rvhonorato/news-ticker"
keywords = ["rss", "news", "cli", "ticker", "feed"]
categories = ["command-line-utilities"]

[dependencies]
feed-rs = "2.0"
tokio = { version = "1", features = ["macros", "rt"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "system-proxy"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = "s"
strip = true
