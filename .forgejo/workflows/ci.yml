name: ci

on:
  push:
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".forgejo/workflows/ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: codeberg-medium

    steps:
      - uses: https://code.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install tarpaulin
        # prebuilt binary: `cargo install` takes 10min+
        run: curl -sL https://github.com/xd009642/tarpaulin/releases/download/0.37.6/cargo-tarpaulin-x86_64-unknown-linux-musl.tar.gz | tar xz -C "$HOME/.cargo/bin"

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests with coverage
        run: cargo tarpaulin --engine llvm --exclude-files 'src/main.rs' --out Html --out Json --output-dir coverage

      - name: Deploy coverage report to Codeberg Pages
        if: forgejo.ref_name == 'main'
        # plain CLI that git-pages/action wraps, so the runner needs no docker
        run: |
          curl -sSL -o "$HOME/.cargo/bin/git-pages-cli" https://codeberg.org/git-pages/git-pages-cli/releases/download/v1.13.1/git-pages-cli.linux-amd64
          chmod +x "$HOME/.cargo/bin/git-pages-cli"
          git-pages-cli "https://${{ forgejo.repository_owner }}.codeberg.page/${{ forgejo.event.repository.name }}/" \
            --path=coverage \
            --parents \
            --token="${{ forgejo.token }}" \
            --upload-dir=coverage/
