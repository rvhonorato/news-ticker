name: ci

on:
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".forgejo/workflows/**"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTUP_VERSION: 1.29.0
  RUSTUP_SHA256: 4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10
  TARPAULIN_VERSION: 0.37.6
  TARPAULIN_SHA256: 952ee5dc4ddc04a94a877263e4b44524cf5ec1cd93a0d4a5f74bfa24db0679b2
  GIT_PAGES_CLI_VERSION: v1.13.1
  GIT_PAGES_CLI_SHA256: 410471d712d6c44ff5284c016f9ccd978095af8d03583f62666006f9f66b570d

jobs:
  ci:
    runs-on: codeberg-medium

    steps:
      - uses: https://code.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: https://code.forgejo.org/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/rustup-init "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/x86_64-unknown-linux-gnu/rustup-init"
          echo "$RUSTUP_SHA256  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install tarpaulin
        # prebuilt binary: `cargo install` takes 10min+
        run: |
          curl -fsSL -o /tmp/tarpaulin.tar.gz "https://github.com/xd009642/tarpaulin/releases/download/$TARPAULIN_VERSION/cargo-tarpaulin-x86_64-unknown-linux-musl.tar.gz"
          echo "$TARPAULIN_SHA256  /tmp/tarpaulin.tar.gz" | sha256sum -c -
          tar xzf /tmp/tarpaulin.tar.gz -C "$HOME/.cargo/bin"

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          cargo tarpaulin --engine llvm --exclude-files 'src/main.rs' --out Html --output-dir coverage | tee coverage.log
          mv coverage/tarpaulin-report.html coverage/index.html

          COVERAGE=$(grep -oE '[0-9]+\.[0-9]+% coverage' coverage.log | grep -oE '^[0-9]+\.[0-9]+')
          COVERAGE_INT=${COVERAGE%.*}
          if [ "$COVERAGE_INT" -ge 80 ]; then COLOR=brightgreen
          elif [ "$COVERAGE_INT" -ge 60 ]; then COLOR=yellow
          elif [ "$COVERAGE_INT" -ge 40 ]; then COLOR=orange
          else COLOR=red
          fi
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"${COLOR}\"}" > coverage/badge.json

      - name: Deploy coverage report to Codeberg Pages
        # TODO: remove the coverage-fix clause before merge, it is only to test the deploy on the PR
        if: (forgejo.event_name == 'push' && forgejo.ref_name == 'main') || forgejo.head_ref == 'coverage-fix'
        env:
          TOKEN: ${{ forgejo.token }}
        # plain CLI that git-pages/action wraps, so the runner needs no docker
        run: |
          curl -fsSL -o "$HOME/.cargo/bin/git-pages-cli" "https://codeberg.org/git-pages/git-pages-cli/releases/download/$GIT_PAGES_CLI_VERSION/git-pages-cli.linux-amd64"
          echo "$GIT_PAGES_CLI_SHA256  $HOME/.cargo/bin/git-pages-cli" | sha256sum -c -
          chmod +x "$HOME/.cargo/bin/git-pages-cli"
          git-pages-cli "https://${{ forgejo.repository_owner }}.codeberg.page/${{ forgejo.event.repository.name }}/" \
            --token="$TOKEN" \
            --upload-dir=coverage/
