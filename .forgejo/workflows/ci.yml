name: ci

on:
  push:
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".forgejo/workflows/ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: codeberg-medium
    container:
      image: docker.io/library/rust:1

    steps:
      - name: Checkout code
        # the remote is the source of truth
        run: |
          git init -b main .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch --depth 1 origin "$FORGEJO_SHA"
          git -c advice.detachedHead=false checkout FETCH_HEAD

      - name: Setup test env
        # use prebuilt tarpaulin binary: `cargo install` take 10min+
        run: |
          rustup component add clippy
          curl -sL https://github.com/xd009642/tarpaulin/releases/latest/download/cargo-tarpaulin-x86_64-unknown-linux-musl.tar.gz | tar xz -C /usr/local/bin

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          cargo tarpaulin --engine llvm --exclude-files 'src/main.rs' --out Html --output-dir coverage | tee coverage.log # --fail-under 85
          mv coverage/tarpaulin-report.html coverage/index.html

          COVERAGE=$(grep -oE '[0-9]+\.[0-9]+% coverage' coverage.log | grep -oE '^[0-9]+\.[0-9]+')
          COVERAGE_INT=${COVERAGE%.*}
          if [ "$COVERAGE_INT" -ge 80 ]; then COLOR=brightgreen
          elif [ "$COVERAGE_INT" -ge 60 ]; then COLOR=yellow
          elif [ "$COVERAGE_INT" -ge 40 ]; then COLOR=orange
          else COLOR=red
          fi
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"${COLOR}\"}" > coverage/badge.json

      - name: Deploy coverage report to Codeberg Pages
        if: forgejo.ref_name == 'main'
        # git-pages/action is docker-based and can't run inside this container job,
        # so use the plain git-pages-cli binary it wraps instead (same pattern as tarpaulin above)
        run: |
          curl -sSL -o /usr/local/bin/git-pages-cli https://codeberg.org/git-pages/git-pages-cli/releases/download/latest/git-pages-cli.linux-amd64
          chmod +x /usr/local/bin/git-pages-cli
          git-pages-cli "https://${{ forgejo.repository_owner }}.codeberg.page/${{ forgejo.event.repository.name }}/" \
            --path=coverage \
            --parents \
            --token="${{ forgejo.token }}" \
            --upload-dir=coverage/
